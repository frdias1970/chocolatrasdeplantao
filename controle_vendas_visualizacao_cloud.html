<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Vendas - Visualização</title>
<style>
  :root {
    --bg: #0f0f11; --surface: #1a1a1e; --surface-hover: #222228; --border: #2a2a30;
    --text: #f0f0f5; --text-secondary: #a0a0b0; --text-muted: #6b6b7b;
    --accent: #6366f1; --accent-hover: #818cf8;
    --success: #22c55e; --success-bg: rgba(34,197,94,0.12);
    --warning: #f59e0b; --warning-bg: rgba(245,158,11,0.12);
    --danger: #ef4444; --danger-bg: rgba(239,68,68,0.12);
    --radius: 12px; --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4); --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --transition: 0.18s ease;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; padding-bottom: 40px; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  header { padding: 24px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  header .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .sync-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); transition: var(--transition); }
  .sync-badge.syncing { background: rgba(99,102,241,0.15); color: var(--accent); border-color: var(--accent); }
  .sync-badge.online { background: var(--success-bg); color: var(--success); border-color: rgba(34,197,94,0.3); }
  .sync-badge.offline { background: var(--warning-bg); color: var(--warning); border-color: rgba(245,158,11,0.3); }
  .sync-badge.error { background: var(--danger-bg); color: var(--danger); border-color: rgba(239,68,68,0.3); }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: var(--radius-sm); border: none; font-size: 14px; font-weight: 500; cursor: pointer; background: var(--surface); color: var(--text); transition: var(--transition); }
  .btn:hover { background: var(--surface-hover); }
  .btn-success { background: var(--success-bg); color: var(--success); }
  .btn-success:hover { background: rgba(34,197,94,0.2); }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--surface); padding: 4px; border-radius: var(--radius-sm); overflow-x: auto; }
  .tab { padding: 10px 16px; border-radius: 8px; border: none; background: transparent; color: var(--text-secondary); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: var(--transition); font-family: inherit; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--bg); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  .panel { display: none; animation: fadeIn 0.25s ease; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px; transition: var(--transition); }
  .stat-box:hover { background: var(--surface-hover); }
  .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .stat-value.success { color: var(--success); }
  .stat-value.danger { color: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 10px 8px; color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 8px; color: var(--text); border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: var(--surface-hover); }
  tr:last-child td { border-bottom: none; }
  .text-right { text-align: right; }
  .text-center { text-align: center; }
  .valor { font-variant-numeric: tabular-nums; font-weight: 500; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge-pago { background: var(--success-bg); color: var(--success); }
  .badge-pendente { background: var(--warning-bg); color: var(--warning); }
  .form-input, .form-select { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-size: 14px; outline: none; transition: var(--transition); font-family: inherit; }
  .form-input:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
  .filter-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-row .form-input, .filter-row .form-select { flex: 1; min-width: 140px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
  .empty-icon { font-size: 32px; margin-bottom: 8px; opacity: 0.5; }
  .date-header { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .date-header .total-dia { color: var(--text); font-weight: 500; }
  .item-desc { color: var(--text-muted); font-size: 13px; }
  .cliente-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .cliente-card:last-child { border-bottom: none; }
  .cliente-nome { font-weight: 500; font-size: 14px; }
  .cliente-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .cliente-valor { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pendente-card { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: var(--radius-sm); background: var(--bg); border: 1px solid var(--border); margin-bottom: 8px; transition: var(--transition); }
  .pendente-card:hover { border-color: var(--danger); }
  .pendente-nome { font-weight: 500; }
  .pendente-valor { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--danger); }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); color: var(--text); padding: 14px 20px; border-radius: var(--radius-sm); border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 14px; font-weight: 500; transform: translateY(100px); opacity: 0; transition: all 0.3s ease; z-index: 1000; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .progress-bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .progress-fill.success { background: var(--success); }
  .progress-fill.warning { background: var(--warning); }
  @media (max-width: 600px) {
    .container { padding: 12px; }
    header h1 { font-size: 18px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-value { font-size: 20px; }
    .card { padding: 14px; }
    table { font-size: 13px; }
    th, td { padding: 8px 6px; }
    .filter-row { flex-direction: column; }
    .filter-row .form-input, .filter-row .form-select { min-width: 100%; }
    .tabs { padding: 3px; }
    .tab { padding: 8px 12px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>🍪 Controle de Vendas</h1>
      <div class="subtitle">Visualização dos dados — apenas leitura</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <div id="sync-status" class="sync-badge">☁️ Carregando...</div>
      <button class="btn btn-success" onclick="exportarCSV()">📊 Exportar CSV</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showPanel('dashboard')" data-panel="dashboard">Dashboard</button>
    <button class="tab" onclick="showPanel('vendas')" data-panel="vendas">Todas as vendas</button>
    <button class="tab" onclick="showPanel('clientes')" data-panel="clientes">Clientes</button>
    <button class="tab" onclick="showPanel('pendencias')" data-panel="pendencias">Pendências</button>
  </div>

  <div id="dashboard" class="panel active">
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-label">Total vendido</div><div class="stat-value" id="dash-total">R$ 0,00</div><div class="stat-sub">desde o início</div></div>
      <div class="stat-box"><div class="stat-label">Recebido</div><div class="stat-value success" id="dash-recebido">R$ 0,00</div><div class="stat-sub" id="dash-pct-rec">0%</div><div class="progress-bar"><div class="progress-fill success" id="dash-bar-rec" style="width:0%"></div></div></div>
      <div class="stat-box"><div class="stat-label">A receber</div><div class="stat-value danger" id="dash-pendente">R$ 0,00</div><div class="stat-sub" id="dash-pct-pen">0%</div><div class="progress-bar"><div class="progress-fill warning" id="dash-bar-pen" style="width:0%"></div></div></div>
      <div class="stat-box"><div class="stat-label">Vendas</div><div class="stat-value" id="dash-qtd">0</div><div class="stat-sub" id="dash-itens">0 itens</div></div>
    </div>
    <div class="card"><div class="card-title">📅 Total por mês</div><div id="dash-meses"></div></div>
    <div class="card"><div class="card-title">📆 Total por dia (últimos 10)</div><div id="dash-dias"></div></div>
  </div>

  <div id="vendas" class="panel">
    <div class="filter-row">
      <input type="text" id="filtro-cliente" class="form-input" placeholder="Filtrar por cliente..." oninput="renderVendas()">
      <select id="filtro-mes" class="form-select" onchange="renderVendas()"><option value="">Todos os meses</option></select>
      <select id="filtro-status" class="form-select" onchange="renderVendas()"><option value="">Todos os status</option><option value="pago">Pago</option><option value="pendente">Pendente</option></select>
    </div>
    <div id="lista-vendas"></div>
  </div>

  <div id="clientes" class="panel">
    <div class="card"><div class="card-title">👥 Resumo por cliente</div><div id="lista-clientes"></div></div>
  </div>

  <div id="pendencias" class="panel">
    <div class="card"><div class="card-title">⚠️ Quem deve</div><div id="lista-devedores"></div></div>
    <div class="card"><div class="card-title">✅ Quem pagou</div><div id="lista-pagos"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BIN_ID = '6a6d431bda38895dfeaad903';
const MASTER_KEY = '$2a$10$rxdZKKb3m/E6u8gu435sIORq.SVWjW8FNfkFzZ/nLT5af2N2i7Xma';
const BIN_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;

let vendas = [];

function formatMoney(v) { return 'R$ ' + v.toFixed(2).replace('.', ','); }
function formatDate(d) { const [y,m,day] = d.split('-'); return day + '/' + m + '/' + y; }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
function formatItens(itens) { if (!Array.isArray(itens)) return String(itens); return itens.map(i => String(i.qtd).padStart(2, '0') + ' ' + i.produto).join(', '); }

function setSyncStatus(status, msg) {
  const el = document.getElementById('sync-status');
  el.className = 'sync-badge ' + status;
  el.textContent = msg;
}

async function loadFromCloud() {
  setSyncStatus('syncing', '☁️ Carregando da nuvem...');
  try {
    const resp = await fetch(BIN_URL + '/latest', {
      method: 'GET',
      headers: { 'X-Master-Key': MASTER_KEY }
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const json = await resp.json();
    const dados = json.record || json;
    if (dados && dados.vendas && Array.isArray(dados.vendas)) {
      vendas = (dados.vendas || []).map(v => ({
        id: v.id,
        data: v.data,
        cliente: v.cliente_nome || v.cliente,
        itens: Array.isArray(v.itens) ? v.itens : [],
        valor: v.valor_total || v.valor || 0,
        status: v.status || 'pendente'
      }));
      setSyncStatus('online', '☁️ Sincronizado');
      showToast('✅ Dados carregados da nuvem');
      return true;
    } else {
      throw new Error('Dados invalidos no bin');
    }
  } catch (err) {
    console.log('[Cloud] Erro ao carregar:', err.message);
    setSyncStatus('error', '❌ Erro ao carregar da nuvem');
    return false;
  }
}

function exportarCSV() {
  let csv = 'id;data;cliente;produtos;qtd_total;valor_total;status' + String.fromCharCode(10);
  vendas.forEach(v => {
    const produtos = Array.isArray(v.itens) ? v.itens.map(i => i.qtd + 'x ' + i.produto).join('; ') : '';
    const qtdTotal = Array.isArray(v.itens) ? v.itens.reduce((s, i) => s + (i.qtd || 0), 0) : 0;
    const valorStr = v.valor.toFixed(2).replace('.', ',');
    csv += [v.id || '', v.data, '"' + v.cliente + '"', '"' + produtos + '"', qtdTotal, valorStr, v.status].join(';') + String.fromCharCode(10);
  });
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'vendas_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); URL.revokeObjectURL(url);
  showToast('📊 CSV exportado!');
}

function showPanel(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector('.tab[data-panel="' + id + '"]').classList.add('active');
  document.getElementById(id).classList.add('active');
  if (id === 'dashboard') renderDashboard();
  if (id === 'vendas') renderVendas();
  if (id === 'clientes') renderClientes();
  if (id === 'pendencias') renderPendencias();
}

function renderDashboard() {
  const total = vendas.reduce((s,v) => s + v.valor, 0);
  const recebido = vendas.filter(v => v.status === 'pago').reduce((s,v) => s + v.valor, 0);
  const pendente = total - recebido;
  const pctRec = total > 0 ? Math.round(recebido / total * 100) : 0;
  const pctPen = total > 0 ? Math.round(pendente / total * 100) : 0;
  document.getElementById('dash-total').textContent = formatMoney(total);
  document.getElementById('dash-recebido').textContent = formatMoney(recebido);
  document.getElementById('dash-pct-rec').textContent = pctRec + '% do total';
  document.getElementById('dash-pendente').textContent = formatMoney(pendente);
  document.getElementById('dash-pct-pen').textContent = pctPen + '% do total';
  document.getElementById('dash-qtd').textContent = vendas.length;
  document.getElementById('dash-bar-rec').style.width = pctRec + '%';
  document.getElementById('dash-bar-pen').style.width = pctPen + '%';
  const totalItens = vendas.reduce((s, v) => { if (!Array.isArray(v.itens)) return s; return s + v.itens.reduce((a, i) => a + (parseInt(i.qtd) || 0), 0); }, 0);
  document.getElementById('dash-itens').textContent = totalItens + ' itens';

  const meses = {};
  vendas.forEach(v => { const mes = v.data.slice(0, 7); if (!meses[mes]) meses[mes] = { total: 0, recebido: 0, pendente: 0, qtd: 0 }; meses[mes].total += v.valor; meses[mes].qtd += 1; if (v.status === 'pago') meses[mes].recebido += v.valor; else meses[mes].pendente += v.valor; });
  const mesesOrd = Object.keys(meses).sort().reverse();
  let htmlM = '<table><tr><th>Mes</th><th>Vendas</th><th class="text-right">Total</th><th class="text-right">Recebido</th><th class="text-right">A receber</th></tr>';
  mesesOrd.forEach(m => { const d = meses[m]; const [y, mo] = m.split('-'); htmlM += '<tr><td>' + mo + '/' + y + '</td><td class="text-center">' + d.qtd + '</td><td class="text-right valor">' + formatMoney(d.total) + '</td><td class="text-right valor" style="color:var(--success)">' + formatMoney(d.recebido) + '</td><td class="text-right valor" style="color:var(--danger)">' + formatMoney(d.pendente) + '</td></tr>'; });
  htmlM += '</table>';
  document.getElementById('dash-meses').innerHTML = htmlM;

  const dias = {};
  vendas.forEach(v => { if (!dias[v.data]) dias[v.data] = { total: 0, qtd: 0 }; dias[v.data].total += v.valor; dias[v.data].qtd += 1; });
  const diasOrd = Object.keys(dias).sort().reverse().slice(0, 10);
  let htmlD = '<table><tr><th>Data</th><th class="text-center">Vendas</th><th class="text-right">Total do dia</th></tr>';
  diasOrd.forEach(d => { htmlD += '<tr><td>' + formatDate(d) + '</td><td class="text-center">' + dias[d].qtd + '</td><td class="text-right valor">' + formatMoney(dias[d].total) + '</td></tr>'; });
  htmlD += '</table>';
  document.getElementById('dash-dias').innerHTML = htmlD;
}

function renderVendas() {
  const filtroCliente = document.getElementById('filtro-cliente').value.toLowerCase();
  const filtroMes = document.getElementById('filtro-mes').value;
  const filtroStatus = document.getElementById('filtro-status').value;
  let filtradas = vendas.filter(v => {
    if (filtroCliente && !v.cliente.toLowerCase().includes(filtroCliente)) return false;
    if (filtroMes && !v.data.startsWith(filtroMes)) return false;
    if (filtroStatus && v.status !== filtroStatus) return false;
    return true;
  }).sort((a, b) => b.data.localeCompare(a.data));
  if (!filtradas.length) { document.getElementById('lista-vendas').innerHTML = '<div class="empty"><div class="empty-icon">📭</div>Nenhuma venda encontrada</div>'; return; }
  const porData = {};
  filtradas.forEach(v => { if (!porData[v.data]) porData[v.data] = []; porData[v.data].push(v); });
  const datas = Object.keys(porData).sort().reverse();
  let html = '';
  datas.forEach(d => {
    const totalDia = porData[d].reduce((s, v) => s + v.valor, 0);
    html += '<div class="date-header"><span>' + formatDate(d) + '</span><span class="total-dia">' + formatMoney(totalDia) + ' — ' + porData[d].length + ' venda' + (porData[d].length > 1 ? 's' : '') + '</span></div>';
    html += '<table><tr><th>Cliente</th><th>Itens</th><th class="text-right">Valor</th><th class="text-center">Status</th></tr>';
    porData[d].forEach((v) => {
      const badge = v.status === 'pago' ? '<span class="badge badge-pago">Pago</span>' : '<span class="badge badge-pendente">Pendente</span>';
      const itensStr = formatItens(v.itens);
      html += '<tr><td>' + v.cliente + '</td><td class="item-desc">' + itensStr + '</td><td class="text-right valor">' + formatMoney(v.valor) + '</td><td class="text-center">' + badge + '</td></tr>';
    });
    html += '</table>';
  });
  document.getElementById('lista-vendas').innerHTML = html;
}

function renderClientes() {
  const resumo = {};
  vendas.forEach(v => { const c = v.cliente; if (!resumo[c]) resumo[c] = { total: 0, recebido: 0, pendente: 0, qtd: 0 }; resumo[c].total += v.valor; resumo[c].qtd += 1; if (v.status === 'pago') resumo[c].recebido += v.valor; else resumo[c].pendente += v.valor; });
  const clientes = Object.keys(resumo).sort((a, b) => resumo[b].total - resumo[a].total);
  let html = '';
  clientes.forEach(c => { const d = resumo[c]; html += '<div class="cliente-card"><div><div class="cliente-nome">' + c + '</div><div class="cliente-meta">' + d.qtd + ' venda' + (d.qtd > 1 ? 's' : '') + ' — ' + formatMoney(d.recebido) + ' recebido / ' + formatMoney(d.pendente) + ' pendente</div></div><div class="cliente-valor">' + formatMoney(d.total) + '</div></div>'; });
  document.getElementById('lista-clientes').innerHTML = html;
}

function renderPendencias() {
  const devedores = {}; const pagos = {};
  vendas.forEach(v => { if (v.status === 'pendente') { if (!devedores[v.cliente]) devedores[v.cliente] = 0; devedores[v.cliente] += v.valor; } else { if (!pagos[v.cliente]) pagos[v.cliente] = 0; pagos[v.cliente] += v.valor; } });
  const devList = Object.entries(devedores).sort((a, b) => b[1] - a[1]);
  let htmlDev = '';
  if (!devList.length) { htmlDev = '<div class="empty"><div class="empty-icon">🎉</div>Ninguem deve!</div>'; }
  else { devList.forEach(([c, v]) => { htmlDev += '<div class="pendente-card"><span class="pendente-nome">' + c + '</span><span class="pendente-valor">' + formatMoney(v) + '</span></div>'; }); }
  document.getElementById('lista-devedores').innerHTML = htmlDev;
  const pagList = Object.entries(pagos).sort((a, b) => b[1] - a[1]);
  let htmlPag = '';
  pagList.forEach(([c, v]) => { htmlPag += '<div class="pendente-card" style="border-color:var(--success)"><span class="pendente-nome">' + c + '</span><span class="pendente-valor" style="color:var(--success)">' + formatMoney(v) + '</span></div>'; });
  document.getElementById('lista-pagos').innerHTML = htmlPag;
}

function initRender() {
  const meses = [...new Set(vendas.map(v => v.data.slice(0, 7)))].sort().reverse();
  const sel = document.getElementById('filtro-mes');
  sel.innerHTML = '<option value="">Todos os meses</option>';
  meses.forEach(m => { const [y, mo] = m.split('-'); sel.innerHTML += '<option value="' + m + '">' + mo + '/' + y + '</option>'; });
  renderDashboard(); renderVendas(); renderClientes(); renderPendencias();
}

async function init() {
  await loadFromCloud();
  initRender();
}

init();
</script>
